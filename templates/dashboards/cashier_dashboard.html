{% extends "base.html" %}
{% load static %}

{% block title %}Cashier POS - Tạo Đơn Hàng{% endblock %}

{% block content %}
<style>
    .cashier-container {
        display: grid;
        grid-template-columns: 2fr 0.9fr;
        gap: 15px;
        height: 90vh;
        padding: 15px;
        background: #f5f5f5;
    }
    
    .cashier-panel {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    .panel-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px;
        font-weight: bold;
        border-bottom: 2px solid #667eea;
    }
    
    .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
    }
    
    .product-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }
    
    .product-card {
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px;
        cursor: pointer;
        transition: all 0.3s;
        text-align: center;
    }
    
    .product-card:hover {
        background: #fff;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        transform: translateY(-2px);
    }
    
    .product-image {
        width: 100%;
        height: 80px;
        background: #f0f0f0;
        border-radius: 4px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }
    
    .product-name {
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 5px;
        color: #333;
    }
    
    .product-price {
        color: #667eea;
        font-weight: bold;
        font-size: 13px;
    }
    
    .order-item {
        background: #f0f8ff;
        border-left: 4px solid #667eea;
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .item-info {
        flex: 1;
    }
    
    .item-name {
        font-weight: 600;
        font-size: 13px;
        color: #333;
    }
    
    .item-size {
        font-size: 11px;
        color: #999;
    }
    
    .item-qty {
        background: white;
        border: 1px solid #ddd;
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 12px;
        min-width: 40px;
        text-align: center;
    }
    
    .item-price {
        font-weight: bold;
        color: #28a745;
        font-size: 13px;
        min-width: 70px;
        text-align: right;
    }
    
    .item-remove {
        color: #dc3545;
        cursor: pointer;
        font-weight: bold;
        margin-left: 10px;
    }
    
    .order-summary {
        background: #f9f9f9;
        padding: 12px;
        border-radius: 4px;
        margin-top: 10px;
    }
    
    .summary-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        font-size: 13px;
    }
    
    .summary-row.total {
        border-top: 2px solid #ddd;
        padding-top: 10px;
        margin-top: 8px;
        font-weight: bold;
        font-size: 16px;
        color: #667eea;
    }
    
    .btn-action {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .btn-create {
        background: #28a745;
        color: white;
    }
    
    .btn-create:hover {
        background: #218838;
    }
    
    .btn-clear {
        background: #dc3545;
        color: white;
    }
    
    .btn-clear:hover {
        background: #c82333;
    }
    
    .search-box {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 12px;
        font-size: 13px;
    }
    
    .category-filter {
        display: flex;
        gap: 5px;
        margin-bottom: 10px;
        overflow-x: auto;
        padding-bottom: 5px;
    }
    
    .category-btn {
        padding: 5px 10px;
        border: 1px solid #ddd;
        background: white;
        border-radius: 20px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
        transition: all 0.3s;
    }
    
    .category-btn:hover,
    .category-btn.active {
        background: #667eea;
        color: white;
        border-color: #667eea;
    }
</style>

<div class="cashier-container">
    <!-- MIDDLE: Danh sách sản phẩm -->
    <div class="cashier-panel">
        <div class="panel-header">
            <i class="bi bi-cup"></i> Sản phẩm
        </div>
        <div class="panel-body">
            <input type="text" class="search-box" id="productSearch" placeholder="🔍 Tìm sản phẩm...">
            
            <div class="category-filter">
                <button class="category-btn active">Tất cả</button>
                <button class="category-btn">Cà phê</button>
                <button class="category-btn">Trà</button>
                <button class="category-btn">Nước</button>
            </div>
            
            <div class="product-grid" id="productList">
                <!-- Products will be loaded dynamically -->
                {% for product in products %}
                <div class="product-card" onclick="addToOrder({{ product.id }}, '{{ product.name }}', {{ product.price_medium }})">
                    <div class="product-image">☕</div>
                    <div class="product-name">{{ product.name }}</div>
                    <div class="product-price">{{ product.price_medium|floatformat:0 }}đ</div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    
    <!-- RIGHT: Chi tiết đơn hàng -->
    <div class="cashier-panel">
        <div class="panel-header">
            <i class="bi bi-clipboard"></i> Chi tiết
        </div>
        <div class="panel-body">
            <div id="orderDetail">
                <p style="text-align: center; color: #999; padding: 20px 0;">
                    <i class="bi bi-info-circle"></i><br>
                    Chọn sản phẩm để tạo đơn
                </p>
            </div>
        </div>
        <div style="padding: 15px; border-top: 2px solid #eee;">
            <button class="btn-action btn-create" onclick="submitOrder()">
                <i class="bi bi-check-circle"></i> Tạo đơn (9)
            </button>
            <button class="btn-action btn-clear" onclick="clearOrder()">
                <i class="bi bi-trash"></i> Xóa
            </button>
        </div>
    </div>
</div>

<script>
let currentOrder = [];
let currentOrderId = null;

function addToOrder(productId, productName, price) {
    const existingItem = currentOrder.find(item => item.id === productId);
    if (existingItem) {
        existingItem.qty++;
    } else {
        currentOrder.push({
            id: productId,
            name: productName,
            price: price,
            qty: 1,
            size: 'M'
        });
    }
    updateOrderDisplay();
}

function removeFromOrder(productId) {
    currentOrder = currentOrder.filter(item => item.id !== productId);
    updateOrderDisplay();
}

function updateOrderDisplay() {
    const detailDiv = document.getElementById('orderDetail');
    let html = '';
    let total = 0;
    
    if (currentOrder.length === 0) {
        html = '<p style="text-align: center; color: #999; padding: 20px 0;"><i class="bi bi-info-circle"></i><br>Chọn sản phẩm để tạo đơn</p>';
    } else {
        currentOrder.forEach(item => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            html += `
                <div class="order-item">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-size">(${item.size})</div>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="number" value="${item.qty}" style="width: 40px; text-align: center;" onchange="updateQty(${item.id}, this.value)">
                        <div class="item-price">${itemTotal.toLocaleString()}đ</div>
                        <span class="item-remove" onclick="removeFromOrder(${item.id})">✕</span>
                    </div>
                </div>
            `;
        });
        
        html += `
            <div class="order-summary">
                <div class="summary-row">
                    <span>Tạm tính:</span>
                    <span>${total.toLocaleString()}đ</span>
                </div>
                <div class="summary-row">
                    <span>Giảm giá:</span>
                    <span>0đ</span>
                </div>
                <div class="summary-row total">
                    <span>Tổng:</span>
                    <span>${total.toLocaleString()}đ</span>
                </div>
            </div>
        `;
    }
    
    detailDiv.innerHTML = html;
    
    // Update button text
    const createBtn = document.querySelector('.btn-create');
    createBtn.innerHTML = `<i class="bi bi-check-circle"></i> Tạo đơn (${currentOrder.length})`;
}

function updateQty(productId, newQty) {
    const item = currentOrder.find(i => i.id === productId);
    if (item) {
        item.qty = parseInt(newQty) || 1;
        if (item.qty <= 0) {
            removeFromOrder(productId);
        } else {
            updateOrderDisplay();
        }
    }
}

function clearOrder() {
    if (confirm('Xóa tất cả sản phẩm trong đơn?')) {
        currentOrder = [];
        updateOrderDisplay();
    }
}

function submitOrder() {
    if (currentOrder.length === 0) {
        alert('Vui lòng thêm sản phẩm');
        return;
    }
    // Redirect to create_order page or submit via AJAX
    window.location.href = "{% url 'create_order' %}";
}

function loadOrderDetail(orderId) {
    // Load order detail from server
    window.location.href = `/orders/${orderId}/`;
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    updateOrderDisplay();
});
</script>
{% endblock %}
